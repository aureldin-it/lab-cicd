name: Deploy App to Local VM

on:
  push:
    branches:
      - main
      - master
      - principal

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Build et Run Docker
        run: |
          docker build -t mon_app_cicd .
          docker stop app_cicd_container || true
          docker rm app_cicd_container || true
          docker run -d --name app_cicd_container -p 8095:80 mon_app_cicd
